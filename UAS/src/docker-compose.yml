version: "3.8"

# ============================================================
# Cluster MongoDB Terdistribusi - Studi Kasus E-Commerce "TokoKita"
# Topologi:
#   - 1 Config Server Replica Set (3 node)  : cfgsvr1..3
#   - Shard 1 Replica Set (3 node)          : shard1a, shard1b, shard1c
#   - Shard 2 Replica Set (3 node)          : shard2a, shard2b, shard2c
#   - 1 Router (mongos)                     : mongos
# Total: 10 kontainer
# ============================================================

services:
  # ---------- Config Server Replica Set ----------
  cfgsvr1:
    image: mongo:7.0
    container_name: cfgsvr1
    command: mongod --configsvr --replSet cfgrs --port 27017 --bind_ip_all
    volumes: [cfgsvr1_data:/data/db]
    networks: [mongo-cluster]

  cfgsvr2:
    image: mongo:7.0
    container_name: cfgsvr2
    command: mongod --configsvr --replSet cfgrs --port 27017 --bind_ip_all
    volumes: [cfgsvr2_data:/data/db]
    networks: [mongo-cluster]

  cfgsvr3:
    image: mongo:7.0
    container_name: cfgsvr3
    command: mongod --configsvr --replSet cfgrs --port 27017 --bind_ip_all
    volumes: [cfgsvr3_data:/data/db]
    networks: [mongo-cluster]

  # ---------- Shard 1 Replica Set ----------
  shard1a:
    image: mongo:7.0
    container_name: shard1a
    command: mongod --shardsvr --replSet shard1rs --port 27017 --bind_ip_all
    volumes: [shard1a_data:/data/db]
    networks: [mongo-cluster]

  shard1b:
    image: mongo:7.0
    container_name: shard1b
    command: mongod --shardsvr --replSet shard1rs --port 27017 --bind_ip_all
    volumes: [shard1b_data:/data/db]
    networks: [mongo-cluster]

  shard1c:
    image: mongo:7.0
    container_name: shard1c
    command: mongod --shardsvr --replSet shard1rs --port 27017 --bind_ip_all
    volumes: [shard1c_data:/data/db]
    networks: [mongo-cluster]

  # ---------- Shard 2 Replica Set ----------
  shard2a:
    image: mongo:7.0
    container_name: shard2a
    command: mongod --shardsvr --replSet shard2rs --port 27017 --bind_ip_all
    volumes: [shard2a_data:/data/db]
    networks: [mongo-cluster]

  shard2b:
    image: mongo:7.0
    container_name: shard2b
    command: mongod --shardsvr --replSet shard2rs --port 27017 --bind_ip_all
    volumes: [shard2b_data:/data/db]
    networks: [mongo-cluster]

  shard2c:
    image: mongo:7.0
    container_name: shard2c
    command: mongod --shardsvr --replSet shard2rs --port 27017 --bind_ip_all
    volumes: [shard2c_data:/data/db]
    networks: [mongo-cluster]

  # ---------- Router (mongos) ----------
  mongos:
    image: mongo:7.0
    container_name: mongos
    command: mongos --configdb cfgrs/cfgsvr1:27017,cfgsvr2:27017,cfgsvr3:27017 --port 27017 --bind_ip_all
    ports:
      - "27017:27017"   # satu-satunya port yang diekspos ke host
    depends_on:
      - cfgsvr1
      - cfgsvr2
      - cfgsvr3
      - shard1a
      - shard2a
    networks: [mongo-cluster]

networks:
  mongo-cluster:
    driver: bridge

volumes:
  cfgsvr1_data:
  cfgsvr2_data:
  cfgsvr3_data:
  shard1a_data:
  shard1b_data:
  shard1c_data:
  shard2a_data:
  shard2b_data:
  shard2c_data:
